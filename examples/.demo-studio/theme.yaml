# demo-studio theme for this codebase: recorded videos and live demos take their look from here.
# Derived by "demo-studio theme init" on 2026-11-24. Edit freely; a demo script's own theme:/frame: keys win.
#   accent <- fixture/index.html (most used colour on buttons/links)
#   font <- fixture/index.html (body font)
# accent: cursor halo, rings, chapter badge, slide bullets | surface: captions, callouts, title cards
# ink: hand-drawn marks | logo: title cards (logoBg: none = no white chip) | frame: wallpaper + rounded window (frame: false = full-bleed)
accent: "#4f46e5"
onAccent: "#ffffff"
ink: "#ff2d55"
font: system-ui, Inter, -apple-system, "Segoe UI", Roboto, sans-serif
surface: "#141431"
onSurface: "#ffffff"
radius: 14
frame:
  background: linear:#141336,#26236d,#645ce8
